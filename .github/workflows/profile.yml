name: Update profile

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      banner:
        description: "留空保留设置；slideshow 每12秒轮播；或填写原图文件名"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "banners/**"
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: read

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/metrics/package-lock.json

      - name: Install render dependencies
        run: |
          python -m pip install Pillow==12.3.0
          npm ci --prefix scripts/metrics --ignore-scripts

      - name: Check Metrics adapters
        run: node --test scripts/metrics/activity.test.mjs scripts/metrics/traffic.test.mjs

      - name: Build banner
        env:
          BANNER_SELECTION: ${{ inputs.banner }}
        run: |
          if [ -n "$BANNER_SELECTION" ]; then
            python scripts/build_banner.py --select "$BANNER_SELECTION" --save-selection
          else
            python scripts/build_banner.py
          fi

      - name: Refresh public repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_repositories.py

      - name: Render profile Metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          METRICS_OUTPUT_DIR: assets
        run: node scripts/metrics/render.mjs

      - name: Commit updated profile
        run: |
          git add README.md assets banners/config.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile banner and public metrics"
          git push
